name: android-release

# GitHub でリリースを公開したときに APK をビルドしてリリースへ添付する。
#
# 任意の Secrets:
#   ANDROID_KEYSTORE_BASE64   署名用 keystore を base64 にしたもの
#   ANDROID_KEYSTORE_PASSWORD keystore のパスワード
#   ANDROID_KEY_ALIAS         鍵のエイリアス
#   ANDROID_KEY_PASSWORD      鍵のパスワード (未設定なら keystore と同じ)
#   GOOGLE_SERVICES_JSON_BASE64  google-services.json を base64 にしたもの (Push 通知用)
# keystore が無い場合は debug 署名の APK を添付する。
#
# 任意の Variables:
#   NEXT_PUBLIC_CHAIN_API_BASE  API の向き先 (未設定なら https://chain.i32.jp)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'APK を添付するリリースのタグ'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      NEXT_PUBLIC_CHAIN_API_BASE: ${{ vars.NEXT_PUBLIC_CHAIN_API_BASE }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: install
        run: pnpm install --frozen-lockfile

      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: build web + cap sync
        run: |
          # 空文字だと config.ts の既定値が効かないので未設定に戻す
          [ -n "$NEXT_PUBLIC_CHAIN_API_BASE" ] || unset NEXT_PUBLIC_CHAIN_API_BASE
          pnpm android:sync

      - name: assemble (release)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: web/android
        run: ./gradlew --no-daemon assembleRelease

      - name: sign
        if: env.HAS_KEYSTORE == 'true'
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/chain-$TAG.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner" verify "$RUNNER_TEMP/chain-$TAG.apk"
          rm "$RUNNER_TEMP/release.jks"

      - name: assemble (debug)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: web/android
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/chain-$TAG-debug.apk"

      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/chain-*.apk --clobber
